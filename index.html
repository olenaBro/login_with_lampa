<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/login_with_lampa/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vanilla App Template</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/Draggable.min.js"></script>
    <script type="module" crossorigin src="/login_with_lampa/index.js"></script>
    <link rel="stylesheet" crossorigin href="/login_with_lampa/assets/index-DFzv4d9r.css">
  </head>
  <body>
    <main>
      
        <section class="lights-off">
            <div class="scene">

                <div class="lamp">
                    <div class="lamp-head"></div>
                    <div class="lamp-stand"></div>
                    <div class="lamp-base"></div>
                    <div class="lamp-chain">
                        <div class="lamp-ball" id="pull"></div>
                    </div>
                </div>
            </div>
        </section>
  
      
        <section class="lights-off">
            <form class="login-card" id="login-form">
                <h2>Login</h2>
                <label for="username">Username</label>
                <input id="username" type="text" placeholder="Username" required autocomplete="username">
                <label for="password">Password</label>
                <input id="password" type="password" placeholder="Password" required autocomplete="current-password">
                <button type="submit">Login</button>
            </form>
        </section>
    
    </main>

  </body>
</html>
